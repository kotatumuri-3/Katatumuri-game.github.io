<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1,
    maximum-scale=1, user-scalable=no"
  >

  <title>かたつむりゲーム☆</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="game">
    <div id="space"></div>

    <div id="header">
      <div class="panel">
        <span class="label">スコア</span>
        <span class="value" id="score">0</span>
      </div>

      <div class="panel">
        <span class="label">経過時間</span>
        <span class="value">
          <span id="time">0</span>秒
        </span>
      </div>

      <button
        id="sound-toggle"
        type="button"
        aria-label="音のオン・オフ"
        aria-pressed="true"
      >🔊</button>

      <button
        id="quit-button"
        type="button"
        aria-label="ゲームを終了する"
      >
        終了
      </button>
    </div>

    <div id="bonus-flash" aria-hidden="true"></div>

    <div
      id="bonus-banner"
      role="status"
      aria-live="polite"
      aria-hidden="true"
    >
      ボーナスタイム！
      <span class="bonus-banner-sub">こたつむりラッシュ☆</span>
    </div>

    <div id="player"></div>

    <section id="start-screen" class="overlay">
      <div class="card">
        <h1>かたつむりゲーム☆</h1>

        <p>
          指でプレイヤーを左右に動かして、<br>
          落ちてくるかたつむりたちを集めよう！<br>
          爆弾を取ったらゲームオーバー！
        </p>

        <div class="name-entry">
          <label for="player-name">プレイヤー名</label>
          <input
            id="player-name"
            type="text"
            maxlength="12"
            autocomplete="nickname"
            enterkeyhint="done"
            placeholder="名前を入力（12文字まで）"
          >
          <p id="name-error">プレイヤー名を入力してください。</p>
        </div>

        <div class="rules">
          <div class="rule-item">
            <img src="images/target.png" alt="通常のかたつむり">
            <span>かたつむり：1点</span>
          </div>

          <div class="rule-item">
            <img src="images/bonus.png" alt="ボーナスかたつむり">
            <span>こたつむり：3点</span>
          </div>

          <div class="rule-item">
            <img src="images/bomb.png" alt="爆弾">
            <span>爆弾：取ったらゲームオーバー</span>
          </div>
        </div>

        <button id="start-button" type="button">
          ゲーム開始☆
        </button>
      </div>
    </section>

    <section
      id="end-screen"
      class="overlay"
      aria-labelledby="end-title"
    >
      <div class="card end-card">
        <p class="end-label">ゲームオーバー</p>

        <h1 id="end-title">ゲームオーバー！</h1>

        <div class="score-result">
          <span class="score-result-label">最終スコア</span>
          <div id="final-score">0点</div>
        </div>

        <p id="message"></p>

        <div class="reward-box">
          <span class="reward-label">かたつむりゲーム☆</span>
          <p id="reward"></p>
        </div>

        <p id="sync-status" aria-live="polite"></p>

        <div class="end-menu">
          <button id="retry-button" class="primary-button" type="button">
            もう一度遊ぶ
          </button>

          <button
            id="ranking-button"
            class="secondary-button"
            type="button"
            aria-expanded="false"
            aria-controls="ranking-area"
          >
            ランキングを見る
          </button>
        </div>
      </div>
    </section>

    <div
      id="ranking-area"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ranking-title"
    >
      <div class="ranking-card">
        <button
          id="ranking-close-button"
          type="button"
          aria-label="ランキングを閉じる"
        >×</button>

        <div class="ranking-hero">
          <span class="ranking-kicker">BEST RECORDS</span>
          <h2 id="ranking-title">ランキング</h2>
          <p>全スコア</p>
        </div>

        <div id="ranking-podium" aria-label="上位3件"></div>

        <div class="ranking-list-label">
          <span>順位・名前・スコア</span>
          <span>プレイ日</span>
        </div>

        <ol
          id="ranking-list"
          tabindex="0"
          aria-label="4位以下のランキング一覧"
        ></ol>
      </div>
    </div>
  </main>

  <!-- 報酬テーブル（グローバル） -->
  <script src="js/rewards.js"></script>

  <!-- 効果音＆BGMエンジン（グローバル） -->
  <script src="js/audio.js"></script>

  <!-- ゲーム本体（モジュール） -->
  <script type="module" src="js/main.js"></script>
</body>
</html>

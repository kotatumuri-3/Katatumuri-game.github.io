<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
  >

  <title>かたつむりゲーム☆</title>

  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: #55c7e8;
      font-family: system-ui, sans-serif;

      background:
        radial-gradient(
          circle at top,
          #fffde7,
          #fff4ad 48%,
          #ffe98d
        );
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #space {
      position: absolute;
      inset: 0;
      opacity: 0.7;
      pointer-events: none;

      background-image:
        radial-gradient(
          circle,
          white 1px,
          transparent 1px
        ),
        radial-gradient(
          circle,
          #55c7e8 1px,
          transparent 1px
        );

      background-position:
        0 0,
        24px 24px;

      background-size:
        48px 48px;
    }

    #header {
      position: absolute;
      top: 12px;
      right: 12px;
      left: 12px;
      z-index: 10;

      display: flex;
      justify-content: space-between;

      pointer-events: none;
    }

    .panel {
      min-width: 112px;
      padding: 9px 14px;

      color: #55c7e8;
      text-align: center;
      font-weight: bold;

      border:
        1px solid
        rgba(85, 199, 232, 0.7);

      border-radius: 16px;

      background:
        rgba(255, 249, 196, 0.95);
    }

    .label {
      display: block;
      color: #55c7e8;
      font-size: 12px;
    }

    .value {
      color: #55c7e8;
      font-size: 23px;
    }

    #player {
      position: absolute;
      bottom: 25px;
      left: 50%;
      z-index: 5;

      width: 100px;
      height: 100px;

      background-image:
        url("player.png");

      background-repeat:
        no-repeat;

      background-position:
        center;

      background-size:
        contain;

      transform:
        translateX(-50%);

      filter:
        drop-shadow(
          0 6px 8px
          rgba(0, 0, 0, 0.5)
        );
    }

    .falling {
      position: absolute;
      top: -75px;
      z-index: 4;

      width: 65px;
      height: 65px;

      background-repeat:
        no-repeat;

      background-position:
        center;

      background-size:
        contain;

      will-change: transform;

      filter:
        drop-shadow(
          0 5px 6px
          rgba(0, 0, 0, 0.4)
        );
    }

    .normal-target {
      background-image:
        url("target.png");
    }

    .bonus-target {
      background-image:
        url("bonus.png");
    }

    .bomb-target {
      background-image:
        url("bomb.png");
    }

    .point-text {
      position: absolute;
      z-index: 20;

      color: #55cfee;
      font-size: 25px;
      font-weight: bold;

      text-shadow:
        0 2px 0 white,
        0 0 7px
        rgba(48, 181, 220, 0.8);

      pointer-events: none;

      animation:
        float-up 0.8s forwards;
    }

    .point-text.bomb-point {
      color: #e53935;

      text-shadow:
        0 2px 0 white,
        0 0 7px
        rgba(229, 57, 53, 0.8);
    }

    @keyframes float-up {
      from {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

      to {
        opacity: 0;

        transform:
          translateY(-70px)
          scale(1.3);
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 30;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 22px;

      background:
        rgba(255, 247, 190, 0.72);
    }

    .card {
      width: min(520px, 92vw);
      max-height: 90vh;
      padding: 24px;

      overflow-y: auto;
      text-align: center;

      color: #55c7e8;

      border:
        1px solid
        rgba(85, 199, 232, 0.75);

      border-radius: 26px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 253, 231, 0.98),
          rgba(255, 241, 161, 0.98)
        );
    }

    h1 {
      margin: 0 0 10px;

      color: #55c7e8;

      font-size:
        clamp(30px, 7vw, 52px);
    }

    p {
      color: #55c7e8;
      line-height: 1.6;
    }

    .rules {
      margin: 16px 0;
      padding: 12px;

      color: #55c7e8;

      border-radius: 16px;

      background:
        rgba(255, 255, 255, 0.65);
    }

    .rule-item {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;
      margin: 8px 0;

      color: #55c7e8;
    }

    .rule-item img {
      width: 48px;
      height: 48px;

      object-fit: contain;
    }

    #image-error {
      display: none;

      margin: 12px 0;
      padding: 10px;

      color: #e53935;
      font-size: 13px;

      border:
        1px solid
        #e53935;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.7);
    }

    button {
      min-width: 180px;
      padding: 14px 24px;

      color: #071126;
      font-size: 18px;
      font-weight: bold;

      border: none;
      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #72f1ff,
          #ffe866
        );

      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    /* 終了画面 */

    #end-screen {
      display: none;

      background:
        rgba(255, 244, 173, 0.82);

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);
    }

    .end-card {
      position: relative;

      width: min(460px, 92vw);
      padding: 30px 24px;

      border:
        2px solid
        rgba(85, 199, 232, 0.68);

      border-radius: 30px;

      background:
        linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.98),
          rgba(255, 249, 196, 0.98)
        );

      box-shadow:
        0 18px 50px
        rgba(85, 199, 232, 0.24);
    }

    .end-label {
      margin: 0 0 5px;

      color: #e6a700;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    .end-card h1 {
      margin: 0 0 20px;
    }

    .score-result {
      margin: 0 auto 18px;
      padding: 15px 20px;

      border:
        2px solid
        rgba(85, 199, 232, 0.35);

      border-radius: 22px;

      background:
        rgba(255, 255, 255, 0.75);
    }

    .score-result-label {
      display: block;
      margin-bottom: 3px;

      color: #55c7e8;
      font-size: 14px;
      font-weight: bold;
    }

    #final-score {
      color: #35b5da;

      font-size:
        clamp(44px, 12vw, 64px);

      font-weight: 900;
      line-height: 1.1;

      text-shadow:
        0 3px 0
        rgba(255, 255, 255, 0.9);
    }

    #message {
      margin: 12px 0;

      color: #35b5da;
      font-size: 20px;
      font-weight: bold;
    }

    .reward-box {
      margin: 16px 0 20px;
      padding: 13px 16px;

      border:
        2px solid
        rgba(255, 193, 7, 0.42);

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 248, 199, 0.95),
          rgba(255, 235, 130, 0.7)
        );
    }

    .reward-label {
      color: #a97900;
      font-size: 12px;
      font-weight: bold;
    }

    #reward {
      min-height: 1.5em;
      margin: 4px 0 0;

      color: #db9800;
      font-size: 21px;
      font-weight: 900;
    }

    .end-menu {
      display: grid;
      gap: 12px;
    }

    .end-menu button {
      width: 100%;
      min-height: 54px;
    }

    .primary-button {
      color: #071126;

      background:
        linear-gradient(
          90deg,
          #72f1ff,
          #ffe866
        );

      box-shadow:
        0 7px 16px
        rgba(85, 199, 232, 0.24);
    }

    .secondary-button {
      color: #269bbd;

      border:
        2px solid
        rgba(85, 199, 232, 0.65);

      background:
        rgba(255, 255, 255, 0.82);
    }

    #ranking-area {
      display: none;

      margin-top: 20px;
      padding: 16px;

      text-align: left;

      border:
        1px solid
        rgba(85, 199, 232, 0.4);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.78);
    }

    .ranking-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding-bottom: 10px;

      border-bottom:
        1px solid
        rgba(85, 199, 232, 0.25);
    }

    .ranking-header h2 {
      margin: 0;

      color: #35b5da;
      font-size: 22px;
    }

    .ranking-header span {
      color: #e6a700;
      font-size: 12px;
      font-weight: 900;
    }

    #ranking-list {
      margin: 12px 0 0;
      padding-left: 32px;
    }

    #ranking-list li {
      margin: 8px 0;
      padding: 7px 10px;

      color: #379fbd;
      font-size: 17px;
      font-weight: bold;

      border-radius: 10px;

      background:
        rgba(238, 251, 255, 0.75);
    }

    #ranking-list li:first-child {
      color: #a97900;

      background:
        rgba(255, 240, 145, 0.62);
    }

    @media (max-height: 700px) {
      .end-card {
        padding: 20px;
      }

      .end-card h1 {
        margin-bottom: 12px;
      }

      .score-result {
        margin-bottom: 10px;
        padding: 10px 16px;
      }

      .reward-box {
        margin: 10px 0 14px;
        padding: 9px 12px;
      }

      .end-menu button {
        min-height: 48px;
        padding: 10px 20px;
      }
    }
  </style>
</head>

<body>
  <main id="game">

    <div id="space"></div>

    <div id="header">
      <div class="panel">
        <span class="label">
          スコア
        </span>

        <span
          class="value"
          id="score"
        >
          0
        </span>
      </div>

      <div class="panel">
        <span class="label">
          残り時間
        </span>

        <span class="value">
          <span id="time">30</span>秒
        </span>
      </div>
    </div>

    <div id="player"></div>

    <!-- 開始画面 -->
    <section
      id="start-screen"
      class="overlay"
    >
      <div class="card">

        <h1>
          かたつむりゲーム☆
        </h1>

        <p>
          指でプレイヤーを左右に動かして、
          落ちてくるかたつむりたちを集めよう！
　　　　　　爆弾は避けてね！
        </p>

        <div id="image-error">
          画像を読み込めませんでした。<br>
          ファイル名と保存場所を確認してください。
        </div>

        <div class="rules">

          <div class="rule-item">
            <img
              src="target.png"
              alt="通常の的"
            >

            <span>
              かたつむり：1点
            </span>
          </div>

          <div class="rule-item">
            <img
              src="bonus.png"
              alt="ボーナス"
            >

            <span>
              こたつむり：3点
            </span>
          </div>

          <div class="rule-item">
            <img
              src="bomb.png"
              alt="ボム"
            >

            <span>
              爆弾：-2点
            </span>
          </div>

        </div>

        <button
          id="start-button"
          type="button"
        >
          ゲーム開始☆
        </button>

      </div>
    </section>

    <!-- 終了画面 -->
    <section
      id="end-screen"
      class="overlay"
      aria-labelledby="end-title"
    >
      <div class="card end-card">

        <p class="end-label">
          ゲームオーバー
        </p>

        <h1 id="end-title">
          タイムアップ！
        </h1>

        <div class="score-result">
          <span class="score-result-label">
            最終スコア
          </span>

          <div id="final-score">
            0点
          </div>
        </div>

        <p id="message"></p>

        <div class="reward-box">
          <span class="reward-label">
            かたつむりゲーム☆
          </span>

          <p id="reward"></p>
        </div>

        <div class="end-menu">

          <button
            id="retry-button"
            class="primary-button"
            type="button"
          >
            もう一度遊ぶ
          </button>

          <button
            id="ranking-button"
            class="secondary-button"
            type="button"
            aria-expanded="false"
            aria-controls="ranking-area"
          >
            ランキングを見る(縦画面)
          </button>

        </div>

        <div
          id="ranking-area"
          aria-hidden="true"
        >
          <div class="ranking-header">

            <h2>
              ランキング
            </h2>

            <span>
              TOP 10
            </span>

          </div>

          <ol id="ranking-list"></ol>
        </div>

      </div>
    </section>

  </main>

  <!-- 特典設定を読み込む -->
  rewards.jsscript>

  <script>
    const game =
      document.getElementById("game");

    const player =
      document.getElementById("player");

    const scoreElement =
      document.getElementById("score");

    const timeElement =
      document.getElementById("time");

    const startScreen =
      document.getElementById(
        "start-screen"
      );

    const endScreen =
      document.getElementById(
        "end-screen"
      );

    const finalScoreElement =
      document.getElementById(
        "final-score"
      );

    const messageElement =
      document.getElementById(
        "message"
      );

    const rewardElement =
      document.getElementById(
        "reward"
      );

    const rankingButton =
      document.getElementById(
        "ranking-button"
      );

    const rankingArea =
      document.getElementById(
        "ranking-area"
      );

    const rankingList =
      document.getElementById(
        "ranking-list"
      );

    const imageError =
      document.getElementById(
        "image-error"
      );

    const startButton =
      document.getElementById(
        "start-button"
      );

    const retryButton =
      document.getElementById(
        "retry-button"
      );

    const rankingStorageKey =
      "imageCatchGameRanking";

    let score = 0;
    let timeLeft = 30;
    let playing = false;

    let objects = [];
    let spawnTimer;
    let clockTimer;
    let animationId;
    let previousTime = 0;

    const imageFiles = [
      "player.png",
      "target.png",
      "bonus.png",
      "bomb.png"
    ];

    function checkImages() {
      for (const fileName of imageFiles) {
        const image =
          new Image();

        image.onerror =
          function () {
            imageError.style.display =
              "block";
          };

        image.src =
          fileName +
          "?check=" +
          Date.now();
      }
    }

    checkImages();

    function movePlayer(clientX) {
      if (!playing) {
        return;
      }

      const gameRect =
        game.getBoundingClientRect();

      const halfWidth =
        player.offsetWidth / 2;

      const newPosition =
        clientX - gameRect.left;

      const limitedPosition =
        Math.max(
          halfWidth,
          Math.min(
            gameRect.width -
              halfWidth,
            newPosition
          )
        );

      player.style.left =
        limitedPosition + "px";
    }

    game.addEventListener(
      "pointerdown",
      function (event) {
        movePlayer(event.clientX);
      }
    );

    game.addEventListener(
      "pointermove",
      function (event) {
        if (
          event.buttons ||
          event.pointerType === "touch"
        ) {
          movePlayer(event.clientX);
        }
      }
    );

    function createObject() {
      if (!playing) {
        return;
      }

      const randomNumber =
        Math.random();

      let targetClass =
        "normal-target";

      let pointValue = 1;

      let speed =
        190 +
        Math.random() * 110;

      if (randomNumber < 0.15) {
        targetClass =
          "bomb-target";

        pointValue = -2;
        speed += 35;
      }

      else if (
        randomNumber < 0.28
      ) {
        targetClass =
          "bonus-target";

        pointValue = 3;
        speed += 20;
      }

      const element =
        document.createElement(
          "div"
        );

      element.className =
        "falling " +
        targetClass;

      const targetSize = 65;

      const usableWidth =
        Math.max(
          1,
          game.clientWidth -
            targetSize -
            16
        );

      const positionX =
        8 +
        Math.random() *
          usableWidth;

      const object = {
        element: element,
        x: positionX,
        y: -75,
        speed: speed,
        value: pointValue,
        removed: false
      };

      element.style.left =
        positionX + "px";

      game.appendChild(element);
      objects.push(object);
    }

    function objectsTouch(
      first,
      second
    ) {
      return !(
        first.right <
          second.left ||
        first.left >
          second.right ||
        first.bottom <
          second.top ||
        first.top >
          second.bottom
      );
    }

    function showPoints(
      x,
      y,
      value
    ) {
      const text =
        document.createElement(
          "div"
        );

      text.className =
        value < 0
          ? "point-text bomb-point"
          : "point-text";

      text.style.left =
        x + "px";

      text.style.top =
        y + "px";

      text.textContent =
        value > 0
          ? "+" + value
          : String(value);

      game.appendChild(text);

      setTimeout(
        function () {
          text.remove();
        },
        850
      );
    }

    function removeObject(object) {
      object.removed = true;
      object.element.remove();
    }

    function update(currentTime) {
      if (!playing) {
        return;
      }

      const elapsedTime =
        Math.min(
          (
            currentTime -
            previousTime
          ) / 1000 || 0,
          0.04
        );

      previousTime =
        currentTime;

      const playerRect =
        player.getBoundingClientRect();

      for (
        const object of objects
      ) {
        if (object.removed) {
          continue;
        }

        object.y +=
          object.speed *
          elapsedTime;

        object.element
          .style.transform =
            "translateY(" +
            object.y +
            "px)";

        const objectRect =
          object.element
            .getBoundingClientRect();

        if (
          objectsTouch(
            objectRect,
            playerRect
          )
        ) {
          score =
            Math.max(
              0,
              score +
                object.value
            );

          scoreElement.textContent =
            score;

          showPoints(
            objectRect.left,
            objectRect.top,
            object.value
          );

          removeObject(object);
        }

        else if (
          objectRect.top >
          game.clientHeight + 20
        ) {
          removeObject(object);
        }
      }

      objects =
        objects.filter(
          function (object) {
            return !object.removed;
          }
        );

      animationId =
        requestAnimationFrame(
          update
        );
    }

    function getRanking() {
      try {
        const savedRanking =
          localStorage.getItem(
            rankingStorageKey
          );

        if (!savedRanking) {
          return [];
        }

        const parsedRanking =
          JSON.parse(
            savedRanking
          );

        return Array.isArray(
          parsedRanking
        )
          ? parsedRanking
          : [];
      }

      catch (error) {
        console.warn(
          "ランキングを読み込めませんでした。",
          error
        );

        return [];
      }
    }

    function saveRanking(
      newScore
    ) {
      const ranking =
        getRanking();

      ranking.push({
        score: newScore,
        playedAt:
          new Date()
            .toLocaleDateString(
              "ja-JP"
            )
      });

      ranking.sort(
        function (
          first,
          second
        ) {
          return (
            second.score -
            first.score
          );
        }
      );

      const topRanking =
        ranking.slice(0, 10);

      try {
        localStorage.setItem(
          rankingStorageKey,
          JSON.stringify(
            topRanking
          )
        );
      }

      catch (error) {
        console.warn(
          "ランキングを保存できませんでした。",
          error
        );
      }
    }

    function renderRanking() {
      const ranking =
        getRanking();

      rankingList.innerHTML =
        "";

      if (
        ranking.length === 0
      ) {
        const emptyItem =
          document.createElement(
            "li"
          );

        emptyItem.textContent =
          "まだ記録がありません";

        rankingList.appendChild(
          emptyItem
        );

        return;
      }

      ranking.forEach(
        function (
          record,
          index
        ) {
          const item =
            document.createElement(
              "li"
            );

          item.textContent =
            record.score +
            "点　" +
            record.playedAt;

          item.setAttribute(
            "aria-label",
            (index + 1) +
              "位、" +
              record.score +
              "点"
          );

          rankingList.appendChild(
            item
          );
        }
      );
    }

    function closeRanking() {
      rankingArea.style.display =
        "none";

      rankingArea.setAttribute(
        "aria-hidden",
        "true"
      );

      rankingButton.setAttribute(
        "aria-expanded",
        "false"
      );

      rankingButton.textContent =
        "ランキングを見る";
    }

    function toggleRanking() {
      const isOpen =
        rankingArea
          .getAttribute(
            "aria-hidden"
          ) === "false";

      if (isOpen) {
        closeRanking();
        return;
      }

      renderRanking();

      rankingArea.style.display =
        "block";

      rankingArea.setAttribute(
        "aria-hidden",
        "false"
      );

      rankingButton.setAttribute(
        "aria-expanded",
        "true"
      );

      rankingButton.textContent =
        "ランキングを閉じる";
    }

    function startGame() {
      clearInterval(spawnTimer);
      clearInterval(clockTimer);

      cancelAnimationFrame(
        animationId
      );

      for (
        const object of objects
      ) {
        object.element.remove();
      }

      objects = [];
      score = 0;
      timeLeft = 30;

      scoreElement.textContent =
        "0";

      timeElement.textContent =
        "30";

      player.style.left =
        "50%";

      startScreen.style.display =
        "none";

      endScreen.style.display =
        "none";

      closeRanking();

      rewardElement.textContent =
        "";

      messageElement.textContent =
        "";

      playing = true;

      previousTime =
        performance.now();

      createObject();

      spawnTimer =
        setInterval(
          createObject,
          620
        );

      clockTimer =
        setInterval(
          function () {
            timeLeft -= 1;

            if (timeLeft < 0) {
              timeLeft = 0;
            }

            timeElement.textContent =
              timeLeft;

            if (timeLeft <= 0) {
              finishGame();
            }
          },
          1000
        );

      animationId =
        requestAnimationFrame(
          update
        );
    }

    function finishGame() {
      if (!playing) {
        return;
      }

      playing = false;

      clearInterval(spawnTimer);
      clearInterval(clockTimer);

      cancelAnimationFrame(
        animationId
      );

      for (
        const object of objects
      ) {
        object.element.remove();
      }

      objects = [];

      finalScoreElement.textContent =
        score + "点";

      let rewardData = {
        message:
          "ゲーム終了！",
        reward:
          "参加特典"
      };

      if (
        typeof getReward ===
        "function"
      ) {
        const result =
          getReward(score);

        if (result) {
          rewardData = result;
        }
      }

      messageElement.textContent =
        rewardData.message;

      rewardElement.textContent =
        rewardData.reward;

      saveRanking(score);
      closeRanking();

      endScreen.style.display =
        "flex";
    }

    startButton.addEventListener(
      "click",
      startGame
    );

    retryButton.addEventListener(
      "click",
      startGame
    );

    rankingButton.addEventListener(
      "click",
      toggleRanking
    );
  </script>
</body>
</html>
